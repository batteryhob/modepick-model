name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python + dependencies
        run: |
          uv python install
          uv sync --group dev --frozen

      - name: Run smoke tests
        # conftest forces sqlite + empty S3/IG so no real services are
        # touched even if a runner were to ship a .env by accident.
        run: uv run pytest -q

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        # `npm run build` is `tsc -b && vite build`, so this catches
        # both type errors and bundler errors in one shot.
        run: npm run build
