[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "boto3>=1.40.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
